plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT' // 使用更稳定的版本
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.lidao.moran'

base {
    archivesName = 'moran-mod'
}

repositories {
    // 阿里云镜像（国内直连，优先）
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
    
    // Cloth Config Repository
    maven {
        name = 'Cloth Config'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.1"

    // 模组配置使用 Cloth Config 的 AutoConfig。
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.118"
}
// datagen 生成资源的输出目录（gradlew runDatagen）
sourceSets.main.resources { srcDir 'src/main/generated' }

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=moran-mod"

            runDir "build/datagen"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
     }
}

// === 临时：导出 BranchModelFactory 生成的模型，供逐字段校验（验证完可删） ===
tasks.register('dumpBranchModels', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lidao.moran.client.model.BranchModelDump'
    args = ['.workbuddy/dynamic_ids.txt', '.workbuddy/gen_java']
}

// === 离线树形模拟渲染器：不进游戏批量验证树形，找完美树基准 ===
// 用法：gradlew simTrees
//       gradlew simTrees -PsimArgs="--seeds 96"
//       gradlew simTrees -PsimArgs="--pick 1234"          （单棵放大 + 打印基准参数）
//       gradlew simTrees -PsimArgs="--env average"        （环境评分降档）
tasks.register('simTrees', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lidao.moran.tools.TreeSimulator'
    args = (project.findProperty('simArgs') ?: '--seeds 48 --out .workbuddy/sim_out')
            .toString().trim().split('\\s+').toList()
}
