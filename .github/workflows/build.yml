# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate and verify block loot tables
        run: |
          set -o pipefail
          ./gradlew runDatagen 2>&1 | tee "$RUNNER_TEMP/moran-datagen.log"
          grep -q 'All providers took:' "$RUNNER_TEMP/moran-datagen.log"
          if [ -n "$(git status --porcelain -- src/main/generated/data)" ]; then
            git status --short -- src/main/generated/data
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
